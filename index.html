  <meta property="og:url" content="https://quizard-app.github.io/quizard/" />

  <title>Quizard — Study from your documents</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0B0820;color:#ECE9FF;font-family:'Inter',system-ui,-apple-system,sans-serif;z-index:9999;background-image:radial-gradient(1.5px 1.5px at 18% 22%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 62% 38%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.5px 1.5px at 78% 72%,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 35% 82%,rgba(255,255,255,.5),transparent 60%);}
    #boot .mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#8B5CF6 0%,#22D3EE 100%);display:grid;place-items:center;color:#fff;box-shadow:0 10px 28px rgba(139,92,246,.5)}
    #boot .mark svg{width:26px;height:26px}
    #boot .label{font-family:'Cinzel',serif;font-size:26px;letter-spacing:0.02em}
    #boot .sub{font-size:13px;color:#B9AFDF;letter-spacing:0.02em}
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.75a5.25 5.25 0 0 1 5.25 5.25v3a1.5 1.5 0 0 1-1.5 1.5h-7.5a1.5 1.5 0 0 1-1.5-1.5v-3A5.25 5.25 0 0 1 12 6.75Z"/><path d="M9 12h6"/><path d="M9 15h6"/><path d="M6.75 12H6a1.5 1.5 0 0 0-1.5 1.5v1.5A2.25 2.25 0 0 0 6.75 17.25H18A2.25 2.25 0 0 0 20.25 15V13.5A1.5 1.5 0 0 0 18.75 12H18"/></svg></div>
    <div class="label">Quizard</div>
    <div class="sub">Study from your documents — offline</div>
  </div>
  <div id="app" role="main"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
